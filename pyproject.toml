[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinetrack"
version = "1.0.0"
description = "A local-first desktop media library for movies and TV shows"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Vamshi Yadav" }]
keywords = ["media-library", "movies", "tv-shows", "vlc", "desktop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = ["PySide6>=6.7,<7"]

[project.urls]
Homepage = "https://github.com/vamshir21/CineTrack"
Repository = "https://github.com/vamshir21/CineTrack"
Issues = "https://github.com/vamshir21/CineTrack/issues"

[tool.setuptools.packages.find]
include = ["cinetrack*"]
