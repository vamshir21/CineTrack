<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E50914" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#333" stroke-width="3" opacity="0.6" />

  <!-- Film Reel / Clapperboard stylized C -->
  <g filter="url(#glow)">
    <!-- Big cinematic 'C' formed with bold Netflix style bars -->
    <path d="M 370 120 
             C 210 120 130 190 130 256 
             C 130 322 210 392 370 392 
             L 370 320 
             C 255 320 205 285 205 256 
             C 205 227 255 192 370 192 
             Z" 
          fill="url(#redGrad)" />
    
    <!-- Central Play Triangle in the 'C' -->
    <polygon points="270,205 375,256 270,307" fill="#FFFFFF" />
  </g>

  <!-- Subtitle Text -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">CINETRACK</text>
</svg>
