name: Bug report
description: Report a reproducible CineTrack problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not attach media files, databases, API keys, or unredacted personal paths."
  - type: input
    id: version
    attributes:
      label: CineTrack version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Linux distribution and desktop environment
      placeholder: "Ubuntu 26.04 / GNOME"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and redacted logs
    validations:
      required: true
